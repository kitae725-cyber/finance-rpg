<section id="result" class="panel center hidden"><div style="font-size:85px">🏆</div><h2>임무 완료!</h2><h1 id="grade"></h1><p id="summary"></p><p id="review"></p><button class="primary" onclick="startGame()">다시 도전하기</button><button class="control" onclick="saveResult()">결과 텍스트 저장</button></section><p class="small">오프라인 시제품: 결과는 서버로 전송되지 않습니다. 음성합성은 브라우저·운영체제의 한국어 음성 지원 여부에 따라 달라집니다. 외부에 공개하기 전 문제·정답·해설을 현행 규정에 맞춰 검증하십시오.</p></main><script>

let idx=0,score=0,trust=50,locked=false,history=[],voiceOn=true,soundOn=true,audio=null,musicOn=true,musicTimer=null,musicStep=0,musicGain=null;const $=id=>document.getElementById(id);function show(id){$(id).classList.remove('hidden')}function hide(id){$(id).classList.add('hidden')}function toggleVoice(){voiceOn=!voiceOn;$('voice').textContent=voiceOn?'🔊 음성 켜짐':'🔇 음성 꺼짐';if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel();else if(voiceOn&&!$('game').classList.contains('hidden'))speak(scenes[idx].dialogue)}function toggleSound(){soundOn=!soundOn;$('sound').textContent=soundOn?'🎵 효과음 켜짐':'🔕 효과음 꺼짐'}function toggleMusic(){musicOn=!musicOn;$('music').textContent=musicOn?'🎼 배경음악 켜짐':'🔇 배경음악 꺼짐';if(musicOn)startMusic();else stopMusic()}
function musicNote(hz,start,duration,vol){if(!audio||!musicGain)return;let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(.0001,start);g.gain.linearRampToValueAtTime(vol,start+.16);g.gain.setValueAtTime(vol,start+duration*.65);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(g).connect(musicGain);o.start(start);o.stop(start+duration+.03)}
function startMusic(){if(!musicOn||musicTimer!==null)return;try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audio)audio=new C();audio.resume();musicGain=audio.createGain();musicGain.gain.value=.23;musicGain.connect(audio.destination);const chords=[[261.63,329.63,392],[220,261.63,349.23],[174.61,261.63,349.23],[196,246.94,392]];function playBar(){if(!musicOn||!musicGain)return;let now=audio.currentTime+.04,c=chords[musicStep%chords.length];musicNote(c[0]/2,now,2.7,.035);for(let i=0;i<4;i++)musicNote(c[i%3],now+i*.7,.9,.024);musicStep++}playBar();musicTimer=setInterval(playBar,2800)}catch(e){}}
function stopMusic(){if(musicTimer!==null){clearInterval(musicTimer);musicTimer=null}if(musicGain){try{musicGain.gain.setTargetAtTime(.0001,audio.currentTime,.08);let old=musicGain;setTimeout(()=>old.disconnect(),900)}catch(e){}musicGain=null}}
function speak(t){if(!voiceOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.92;let vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ko'));if(vs.length)u.voice=vs[0];speechSynthesis.speak(u)}function beep(type){if(!soundOn)return;try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audio)audio=new C();if(audio.state==='suspended')audio.resume();let now=audio.currentTime;let notes=type==='win'?[523,659,784]:type==='lose'?[260,195]:[440,660];notes.forEach((hz,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type=type==='lose'?'triangle':'sine';o.frequency.value=hz;g.gain.setValueAtTime(.0001,now+i*.12);g.gain.exponentialRampToValueAtTime(.12,now+i*.12+.015);g.gain.exponentialRampToValueAtTime(.0001,now+i*.12+.17);o.connect(g).connect(audio.destination);o.start(now+i*.12);o.stop(now+i*.12+.18)})}catch(e){}}function startGame(){idx=0;score=0;trust=50;history=[];hide('start');hide('result');show('game');startMusic();render()}function render(){locked=false;let s=scenes[idx];$('mission').textContent='MISSION '+(Math.floor(idx/2)+1)+' / 5';$('score').textContent='⭐ 경험치 '+score;$('trust').textContent='🛡️ 신뢰도 '+trust;$('progress').style.width=idx*10+'%';['location','avatar','speaker','dialogue','title','question'].forEach(k=>$(k).textContent=s[k]);let box=$('choices');box.replaceChildren();s.choices.forEach((c,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=(i+1)+'. '+c;b.onclick=()=>choose(i,b);box.appendChild(b)});$('feedback').style.display='none';hide('next');beep('open');speak(s.dialogue)}function choose(i,b){if(locked)return;locked=true;let s=scenes[idx],ok=i===s.answer;history.push(ok);if(ok){score+=10;trust=Math.min(100,trust+5)}else trust=Math.max(0,trust-5);document.querySelectorAll('.choice').forEach(x=>x.disabled=true);b.classList.add('selected');$('score').textContent='⭐ 경험치 '+score;$('trust').textContent='🛡️ 신뢰도 '+trust;$('feedback').textContent=(ok?'🎉 임무 성공! +10 XP':'⚠️ 아쉬운 선택입니다.')+'\n'+s.tip;$('feedback').style.whiteSpace='pre-line';$('feedback').style.display='block';$('feedback').style.borderLeftColor=ok?'#7de4bc':'#ff8d89';show('next');beep(ok?'win':'lose');if(ok){let x=document.createElement('div');x.className='burst';x.textContent='⭐';document.body.appendChild(x);setTimeout(()=>x.remove(),1000)}speak((ok?'임무 성공. ':'다시 생각해 봅시다. ')+s.tip)}function nextScene(){if(!locked)return;idx++;if(idx>=scenes.length)finish();else render()}function finish(){stopMusic();if('speechSynthesis'in window)speechSynthesis.cancel();hide('game');show('result');let grade=score>=90?'S · 전설의 재정 수호자':score>=70?'A · 우수 재정담당관':score>=50?'B · 성장하는 담당관':'C · 복습이 필요한 담당관';$('grade').textContent=grade;$('summary').textContent='최종 경험치 '+score+'/100 · 신뢰도 '+trust;let wrong=history.map((x,i)=>x?null:i+1).filter(x=>x!==null);$('review').textContent=wrong.length?'복습 권장 상황: '+wrong.join(', ')+'번':'모든 상황에서 적절한 판단을 선택했습니다!';beep('win')}function saveResult(){let t='미션! 재정담당관의 하루 2.2\n'+$('grade').textContent+'\n'+$('summary').textContent+'\n'+$('review').textContent;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download='재정담당관_게임결과.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.addEventListener('keydown',e=>{if($('game').classList.contains('hidden'))return;if(!locked&&['1','2','3'].includes(e.key)){let b=document.querySelectorAll('.choice')[Number(e.key)-1];if(b)b.click()}else if(locked&&e.key==='Enter')nextScene()});
